function render(){document.body.dataset.screen=screen;app.innerHTML=(replaying?`<div class="replay-ui"><span class="eyebrow"><i class="record-dot"></i> BEST TRICK / SLOW-MOTION REPLAY</span><button class="secondary" data-action="stop-replay">${icon('close')} EXIT REPLAY</button><h2>RELIVE THE SEND<span>.</span></h2></div>`:screen==='menu'?header()+`<main>${tab==='ride'?ride():tab==='garage'?garage():records()}</main>`+footer():screen==='play'?hud():resultView())+modalView();if(modal)requestAnimationFrame(()=>app.querySelector('.modal button')?.focus());}
function begin(){modal=null;result=null;screen='play';engine.start(selected,mode);render();}
function openHelp(){if(screen==='play')engine.pause(true);modal='help';render();}
function togglePause(){if(screen!=='play')return;if(modal){modal=null;engine.pause(false);}else{modal='pause';engine.pause(true);}render();}
function closeModal(){modal=null;if(screen==='play')engine.pause(false);render();}
function buy(category,id,price){if(save.coins<price){notify(`You need ${num(price-save.coins)} more coins. Land tricks to earn them.`);return false;}save.coins-=price;save[category].push(id);return true;}
async function action(name,value){switch(name){case'account':modal='account';render();break;case'create-account':await account.create($('rider-name').value,save);break;case'sync':if(account.pending)await account.flush();else await account.connect();break;case'cloud-save':account.resolve('cloud',save);break;case'device-save':account.resolve('device',save);break;case'export-save':downloadSave(save);break;case'import-save':openImport();break;case'confirm-import':if(importedSave){try{storage.setItem((account?.key||'send-it-v1')+'-recovery',writeBackup(save));}catch{}applySave(importedSave);importedSave=null;persist();modal='account';render();notify('Save imported. Your previous progress is kept in a recovery backup.');}break;case'export-recovery':{let raw;try{raw=storage.getItem((account?.key||'send-it-v1')+'-recovery');}catch{}if(raw)downloadSave(readBackup(raw));else notify('No recovery backup on this device yet.');break;}case'tab':tab=value;modal=null;engine.preview(selected,tab==='garage');render();break;case'mode':mode=value;render();break;case'map':{const map=MAPS.find(m=>m.id===value);if(!save.maps.includes(value))modal={type:'map',id:value};else{selected=map;engine.preview(selected);}render();break;}case'unlock-map':{const map=MAPS.find(m=>m.id===value);if(!save.maps.includes(value)&&buy('maps',value,map.price)){selected=map;modal=null;persist();engine.preview(selected);render();notify(`${map.name} unlocked. Find your line.`);}break;}case'start':case'restart':if(screen==='play'&&engine.state.distance>1){if(engine.bestRunReplay&&(!save.replay||engine.bestRunReplay.points>save.replay.points))save.replay=engine.bestRunReplay;const r=engine.state;const bank={map:r.map.id,mode:r.mode,score:r.score,bestCombo:r.bestCombo,time:r.time,distance:r.distance,crashes:r.crashes,coins:Math.floor(r.score/35+r.distance/15),finished:false,medal:false,achievements:r.achievements};save=awardRun(save,bank);persist();}begin();break;case'help':openHelp();break;case'pause':togglePause();break;case'close':closeModal();break;case'settings':if(screen==='play')engine.pause(true);modal='settings';render();break;case'easy':case'wild':save.settings[name]=!save.settings[name];persist();render();break;case'sound':save.settings.sound=!save.settings.sound;persist();render();break;case'slowmo':save.settings.slowmo=!save.settings.slowmo;persist();render();break;case'fullscreen':try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{notify('Fullscreen is unavailable in this browser window.');}break;case'home':screen='menu';tab='ride';modal=null;engine.preview(selected);render();if(account.status==='deferred')account.connect();break;case'end':modal=null;engine.finish(true);break;case'bike':{const b=BIKES.find(b=>b.id===value);if(save.bikes.includes(value)||buy('bikes',value,b.price)){save.bike=value;persist();render();notify(`${b.name} equipped.`);}break;}case'color':{const i=Number(value);if(save.colors.includes(i)||buy('colors',i,150)){save.color=i;persist();render();}break;}case'replay':engine.playReplay(screen==='result'?engine.bestRunReplay:save.replay);break;case'stop-replay':engine.stopReplay();break;}}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)action(b.dataset.action,b.dataset.value);});
app.addEventListener('change',e=>{const el=e.target;if(el.dataset.custom){const cat=el.dataset.custom,n=Number(el.value);if(n===0||save.cosmetics.includes(cat+n)||buy('cosmetics',cat+n,200)){save[cat]=n;persist();}render();}if(el.id==='quality'){save.settings.quality=el.value;persist();render();}if(el.id==='record-mode'){recordMode=el.value;render();}});
app.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-input]');if(b){e.preventDefault();b.setPointerCapture(e.pointerId);engine.setInput(b.dataset.input,true,e.pointerId);b.classList.add('pressed');}});for(const event of ['pointerup','pointercancel','lostpointercapture'])app.addEventListener(event,e=>{const b=e.target.closest('[data-input]');if(b){engine.setInput(b.dataset.input,false,e.pointerId);b.classList.remove('pressed');}});
window.addEventListener('keydown',e=>{if(e.key==='Tab'&&modal){const focusable=[...app.querySelectorAll('.modal button:not(:disabled), .modal select')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}if(e.code==='KeyH'&&screen==='menu'&&!e.repeat)openHelp();if(e.code==='Escape'&&screen!=='play'&&modal)closeModal();});
let snapshot={};
function updateHUD(s){snapshot=s;if(screen!=='play'||replaying)return;const set=(id,v)=>{const el=$(id);if(el)el.textContent=v;};set('speed',Math.round(s.speed));set('score',num(s.score));set('timer',formatTime(mode==='trick'?Math.max(0,120-s.time):s.time));set('distance',mode==='air'?`${s.bigJumps} / 3`:`${num(s.distance)} M`);if($('speed-bar'))$('speed-bar').style.width=Math.min(100,s.speed/1.4)+'%';if($('course-progress'))$('course-progress').style.width=Math.min(100,s.progress*100)+'%';set('countdown',s.countdown>1?Math.ceil(s.countdown-0.6):s.countdown>0?'SEND IT!':'');const challenge=AIR_CHALLENGES[s.challengeIndex];set('challenge-name',challenge?challenge.name:'ALL FOUR LANDED');set('challenge-detail',challenge?`${challenge.detail} · +${num(challenge.bonus)} PTS`:`+${num(s.challengePoints)} bonus points`);const air=!s.grounded&&s.crashTime<=0;const touch=innerWidth<760||matchMedia('(pointer:coarse)').matches;const rampDistance=s.nextRamp===undefined?Infinity:s.nextRamp-s.course;set('trail-callout',s.countdown>0||s.crashTime>0?'':s.nextToy&&s.nextToy.s-s.course<65?`${s.nextToy.name} IN ${Math.ceil(s.nextToy.s-s.course)} M`:air?'':rampDistance<65?`↗ JUMP IN ${Math.ceil(rampDistance)} M · LINE UP BETWEEN THE FLAGS`:s.distance<30?'HOLD W TO PEDAL · SPACE TO HOP':'');const display=$('air-display');if(display)display.classList.toggle('visible',air||s.combo>1);set('combo-title',s.loop?'LOOP THE WHOA!':s.alien?'UFO YEET!':s.jet?'ROCKET BIKE!':air&&s.bounce?'BOOOING!':air&&s.stunt?`${s.stunt}!`:air&&s.rocketTime>0?'ROCKET SEND!':s.combo>1?`COMBO ×${s.combo}`:air&&s.mega?'MOONSHOT!':air?'AIR TIME':'');set('sky-ring-count',s.wild?`SKY RINGS ${s.ringCount} · +800 EACH ON LANDING`:'');set('arcade-hint',s.countdown>0?'':s.loop?'MAGNETIC TRACK · ENJOY THE UPSIDE DOWN':s.jet?'YOU ARE A BICYCLE. YOU ARE ALSO A PLANE.':s.alien?'ALIENS REFILLED YOUR FUEL. HOW POLITE.':s.stunt?`${s.stunt} · ENJOY THE RIDE`:air?(s.assist?'AUTO LANDING · WE GOT YOU':s.boostReady?(touch?'JUMP+ = ROCKET BOOST':'SPACE = ROCKET BOOST'):'BOOST USED · LAND TO REFILL'):(touch?'TAP STUNT FOR AN INSTANT COMBO':'TAP K FOR AN INSTANT COMBO'));set('fuel-label',s.jet?'FLYING!':s.jetLocked?(touch?'RELEASE FLY':'RELEASE G'):s.fuel<.15?'REFUEL ON GROUND':touch?'HOLD FLY':'HOLD G TO FLY');set('fuel-detail',`${Math.max(0,s.fuel||0).toFixed(1)}s fuel · ground / rings / UFOs`);if($('fuel-bar'))$('fuel-bar').style.width=Math.max(0,Math.min(100,(s.fuel||0)/3.5*100))+'%';$('jet-meter')?.classList.toggle('flying',s.jet);set('pending',air&&s.pending>0?`+${num(s.pending)}`:'');set('tricks',air?s.tricks.join(' + '):'');set('slow-label',s.slow?'S L O W  M O T I O N':air?'MAKE IT COUNT.':`${Math.ceil(s.comboTime)}s TO KEEP IT GOING`);const landing=$('landing-toast');if(landing){landing.textContent=s.toast;landing.classList.toggle('crashed',s.crashTime>0);landing.classList.toggle('visible',!!s.toast);}const guide=$('air-guide');if(guide){guide.style.opacity=air?'1':'0';const pitch=Math.abs(Math.atan2(Math.sin(s.pitch),Math.cos(s.pitch))),yaw=Math.abs(Math.atan2(Math.sin(s.yaw),Math.cos(s.yaw))),tail=Math.abs(Math.atan2(Math.sin(s.tail),Math.cos(s.tail))),roll=Math.abs(Math.atan2(Math.sin(s.roll),Math.cos(s.roll))),ready=pitch<.65&&yaw<.9&&tail<.9&&roll<.6;guide.classList.toggle('ready',ready);set('air-height',`${s.height.toFixed(1)} M HIGH / ${s.airtime.toFixed(1)} S AIRTIME`);set('level-text',s.loop?'MAGNETIC GRIP':s.jet?(touch?'RELEASE FLY TO COAST':'RELEASE G TO COAST'):s.assist?'AUTO LANDING':ready?'READY TO STOMP':tail>.9?'CATCH YOUR TAILWHIP':'LEVEL OUT TO LAND');set('rotation-readout',`FLIP ${Math.round(Math.abs(s.pitch)*180/Math.PI)}°  /  SPIN ${Math.round(Math.abs(s.yaw)*180/Math.PI)}° / ROLL ${Math.round(Math.abs(s.roll)*180/Math.PI)}°`);$('level-needle').style.transform=`rotate(${-s.pitch}rad)`;}document.body.classList.toggle('rocket-active',s.rocketTime>0||s.jet);document.body.classList.toggle('jet-active',s.jet);document.body.classList.toggle('alien-active',s.alien);document.body.classList.toggle('at-speed',s.speed>90);document.body.classList.toggle('crash-flash',s.crashTime>1.8);}

const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function applySave(value){save=loadSave({getItem:()=>JSON.stringify(value)});saveProgress(account?.storage||storage,save);engine?.setSave(save);if(!save.maps.includes(selected.id)){selected=MAPS[0];engine?.preview(selected);}if(engine)render();}
function downloadSave(value){const url=URL.createObjectURL(new Blob([writeBackup(value)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='SEND-IT-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function openImport(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{if(!input.files?.[0])return;if(input.files[0].size>262144)throw Error('Save file is too large.');importedSave=readBackup(await input.files[0].text());modal='import';render();}catch(error){notify(error.message);}};input.click();}
function accountView(){
 const a=account;
 let content='<span class="eyebrow">YOUR RIDER. EVERY DEVICE.</span><h2>RIDER ACCOUNT<span>.</span></h2><p class="sync-status">'+escapeHTML(a?.message||'Checking account…')+'</p>';
 if(a?.available&&!a.user)content+='<a class="drop-button" href="/signin-with-chatgpt?return_to=%2F" target="_top">SIGN IN / CREATE ACCOUNT '+icon('arrow')+'</a><p class="fine-print">Continue with ChatGPT, then choose your rider name. Bikes, coins, records and your best replay stay with your account.</p>';
 if(a?.user&&!a.profile)content+='<label class="custom-label" for="rider-name">RIDER NAME</label><input class="account-name" id="rider-name" maxlength="24" minlength="2" autocomplete="nickname" placeholder="Your rider name"><button class="drop-button" data-action="create-account" '+(a.busy?'disabled':'')+'>CREATE RIDER ACCOUNT '+icon('arrow')+'</button><p class="fine-print">Your current local progress becomes your first cloud save.</p>';
 if(a?.profile){content+='<div class="account-card"><strong>'+escapeHTML(a.profile.name)+'</strong><small>RIDER '+escapeHTML(a.profile.riderCode.slice(0,8).toUpperCase())+'</small><span>Level '+level()+' · '+num(save.coins)+' coins · '+save.maps.length+' mountains</span></div>';
  if(a.conflict)content+='<div class="save-conflict"><p>Cloud: '+num(a.conflict.save.coins)+' coins · level '+(1+Math.floor(a.conflict.save.xp/1000))+'<br>This device: '+num((a.pending?.save||save).coins)+' coins · level '+(1+Math.floor((a.pending?.save||save).xp/1000))+'</p><button class="secondary" data-action="cloud-save">USE CLOUD SAVE</button><button class="secondary" data-action="device-save">KEEP THIS DEVICE’S SAVE</button><p class="fine-print">Keeping this device replaces cloud progress. Download a backup first if you want to keep both.</p></div>';
  else content+='<button class="secondary" data-action="sync" '+(a.busy?'disabled':'')+'>'+icon('restart')+' SYNC NOW</button>';
 }
 content+='<div class="save-tools"><span class="section-label">TAKE YOUR PROGRESS WITH YOU</span><button class="menu-option" data-action="export-save">'+icon('arrow')+' Download save file</button><button class="menu-option" data-action="import-save">'+icon('restart')+' Import save file</button><button class="menu-option" data-action="export-recovery">'+icon('help')+' Download previous save</button><p class="fine-print">Save files work offline. Import on another device to transfer your rider without a cloud connection.</p></div>';
 if(a?.user&&a.available)content+='<a class="secondary" href="/signout-with-chatgpt?return_to=%2F" target="_top">SIGN OUT</a>';
 return content;
}
function importView(){return '<span class="eyebrow">BRING YOUR RIDER HOME.</span><h2>IMPORT PROGRESS<span>?</span></h2><p>Incoming save: '+num(importedSave.coins)+' coins, level '+(1+Math.floor(importedSave.xp/1000))+', '+importedSave.maps.length+' mountains.</p><p>This replaces your active progress'+(account?.profile?' and updates your cloud save':'')+'. Your current save is kept as a recovery backup.</p><button class="drop-button" data-action="confirm-import">USE IMPORTED SAVE '+icon('check')+'</button><button class="menu-option" data-action="account">Cancel</button>';}

try{engine=new GameEngine($('world'),save,{snapshot:updateHUD,arcade:notify,challenge:e=>notify(`${e.name} COMPLETE! +${num(e.bonus)} PTS`),pause:togglePause,help:openHelp,finish:(r,replay)=>{result=r;save=awardRun(save,r);if(replay&&(!save.replay||replay.points>save.replay.points))save.replay=replay;persist();screen='result';modal=null;render();},replay:(active)=>{replaying=active;render();}});render();account=new CloudAccount({storage,onChange:()=>{if(modal==='account')render();const dot=document.querySelector('.account-status');if(dot)dot.classList.toggle('synced',account.status==='synced');},onApply:applySave,canApply:()=>screen==='menu'});account.connect();window.addEventListener('online',()=>{if(account.pending)account.flush();else if(screen==='menu')account.connect();});if(new URLSearchParams(location.search).has('qa'))window.__SENDIT__={engine,account,get save(){return save;},get snapshot(){return snapshot;},start:begin,action,get screen(){return screen;}};}catch(error){app.innerHTML=`<div class="fatal"><b>SEND IT!</b><h1>We couldn't start the 3D engine.</h1><p></p><button onclick="location.reload()">TRY AGAIN</button></div>`;app.querySelector('.fatal p').textContent=error.message;console.error(error);}
window.addEventListener('pagehide',()=>saveProgress(account?.storage||storage,save));

return {};})();
</script></body></html>
